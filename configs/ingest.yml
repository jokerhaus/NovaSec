# Конфигурация NovaSec Ingest Service

server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: "30s"
  write_timeout: "30s"
  idle_timeout: "60s"

nats:
  urls:
    - "nats://nats:4222"
  cluster_id: "novasec"
  client_id: "novasec-ingest"
  credentials: ""
  jwt: ""
  nkey: ""
  timeout: "30s"

clickhouse:
  hosts:
    - "clickhouse"
  database: "novasec"
  username: "novasec"
  password: "novasec123"
  port: 9000
  secure: false
  compress: true
  max_open: 100
  max_idle: 10
  timeout: "30s"

postgresql:
  host: "postgres"
  port: 5432
  database: "novasec"
  username: "novasec"
  password: "novasec123"
  ssl_mode: "disable"
  max_open_conns: 100
  max_idle_conns: 10
  conn_max_lifetime: "1h"

redis:
  host: "redis"
  port: 6379
  password: "novasec123"
  db: 0
  timeout: "5s"

logging:
  level: "info"
  format: "json"
  output: "stdout"
  max_size: 100
  max_backups: 3
  max_age: 28
  compress: true

tls:
  enabled: false
  ca_file: "configs/tls/ca.crt"
  cert_file: "configs/tls/ingest.crt"
  key_file: "configs/tls/ingest.key"
  min_version: "1.2"
  client_auth: "require_and_verify"

limits:
  max_body_size: "10MB"
  max_events_per_request: 10000
  rate_limit_per_minute: 1000
  max_concurrent_requests: 100

agents:
  allowed_agent_ids: []  # [] = разрешены все агенты
  agent_timeout: "5m"
  max_agent_connections: 1000

wazuh:
  enabled: false

metrics:
  enabled: true
  port: 9090
  path: "/metrics"
  collect_interval: "30s"
